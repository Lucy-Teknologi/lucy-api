# Network & General
bind 0.0.0.0
port 6379
protected-mode yes
timeout 0
tcp-keepalive 300
daemonize no

# Authentication
# Must match REDIS_PASSWORD from .env
requirepass ${REDIS_PASSWORD}

# Persistence & Storage
dir /data
dbfilename dump.rdb
save 3600 1
save 300 100
save 60 10000
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes

# Security: Disable critical administrative commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command MODULE ""
rename-command DEBUG ""
rename-command SHUTDOWN ""
rename-command SAVE ""
rename-command BGSAVE ""
