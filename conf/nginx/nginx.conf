server {
    listen 8000;

    server_name localhost;

    root /var/www/html;
    
    index index.html index.htm index.nginx-debian.html;

    location / {
        try_files $uri /index.html;
    }
}

server {
        listen 8080;

        gzip on;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_proxied any;
        gzip_vary on;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/x-javascript
            application/json
            application/xml
            application/rss+xml
            image/svg+xml
            font/ttf
            font/otf
            font/woff
            font/woff2;

        location / {
            proxy_pass http://lucy-app:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
}