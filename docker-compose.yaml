x-mongo-common: &mongo-common
  build:
    context: .
    dockerfile: ./mongo.dockerfile
  restart: always
  command:
    - mongod
    - --replSet
    - ${MONGO_REPLICA_SET}
    - --keyFile
    - /data/configdb/mongo-keyfile
    - --auth
    - --bind_ip_all
  environment:
    MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
    MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
  networks:
    - lucy
  logging:
    driver: json-file
    options:
      max-size: "200k"
      max-file: "10"
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep 1"
      ]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 10s

services:
  # APP
  lucy-app:
    build:
      context: ./app
      dockerfile: ../lucy-app.dockerfile
    image: lucy-app:latest
    container_name: lucy-app
    restart: always
    volumes:
      - ./app:/go/src/app
    depends_on:
      - lucy-mongo-init
      - lucy-redis
    networks:
      - lucy
    platform: linux/amd64
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  lucy-nginx:
    image: nginx:mainline-alpine
    container_name: lucy-nginx
    restart: always
    ports:
      - "${APP_NGINX}:${APP_NGINX}"
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./control-panel:/var/www/html
      - ./conf/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lucy
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  lucy-mongo1:
    <<: *mongo-common
    ports:
      - 27017:27017
    container_name: lucy-mongo1
    volumes:
      - ./volumes/rs1:/data/db
      - ./conf/mongo:/tmp/mongo-config:ro

  lucy-mongo2:
    <<: *mongo-common
    container_name: lucy-mongo2
    volumes:
      - ./volumes/rs2:/data/db
      - ./conf/mongo:/tmp/mongo-config:ro

  lucy-mongo3:
    <<: *mongo-common
    container_name: lucy-mongo3
    volumes:
      - ./volumes/rs3:/data/db
      - ./conf/mongo:/tmp/mongo-config:ro

  lucy-mongo-init:
    image: mongo:7.0
    container_name: lucy-mongo-init
    restart: "no"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET}
    volumes:
      - ./conf/mongo/setup.sh:/tmp/setup.sh:ro
    command: ["sh", "/tmp/setup.sh"]
    depends_on:
      lucy-mongo1:
        condition: service_healthy
      lucy-mongo2:
        condition: service_healthy
      lucy-mongo3:
        condition: service_healthy
    networks:
      - lucy
    logging:
      driver: json-file
      options:
        max-size: "200k"
        max-file: "10"

  # REDIS
  lucy-redis:
    image: redis:7-alpine
    container_name: lucy-redis
    restart: always
    ports:
      - 6379
    volumes:
      - ./volumes/redis:/data
    networks:
      - lucy
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

networks:
  lucy:
    driver: bridge